project:
  name: "f1-predictor"
  version: "0.1.0"

data:
  start_year: 2010
  end_year: 2026
  raw_path: "data/raw"
  processed_path: "data/processed"
  external_path: "data/external"
  cache_enabled: true
  cache_path: "data/cache"

features:
  recent_races_form: 5
  team_pace_races: 5
  track_history_races: 5
  columns:
    - grid_position
    - recent_form_avg
    - team_pace_avg
    - track_history_avg
    - championship_position
    - races_experience
    - teammate_gap
    - race_round

model:
  name: "xgboost_multiclass"
  objective: "multi:softprob"
  num_class: 4
  eval_metric: "mlogloss"
  params:
    max_depth: 6
    learning_rate: 0.1
    n_estimators: 500
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
  early_stopping_rounds: 20
  test_size: 0.2
  
validation:
  strategy: "walk_forward"
  train_until: 2021
  val_year: 2022
  test_years:
    - 2023
    - 2024
    - 2025

paths:
  models: "models"
  reports: "reports"
  notebooks: "notebooks"
  
dashboard:
  title: "F1 Podium Predictor"
  default_year: 2024
  default_round: 1
